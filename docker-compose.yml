services:
  postgres:
    image: postgres:16-alpine
    container_name: arc-and-form-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-arc_and_form}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-arc_and_form}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
