spring:
  application:
    name: arc-and-form-test
  datasource:
    url: jdbc:h2:mem:arc_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: 4c8b671a5c378e99480cf890bbd10523ec365445217e132954da80537efbc409
    expiration-ms: 86400000
    cookie-name: arc_token
    cookie-secure: false
    cookie-same-site: Lax
  cors:
    allowed-origins: http://localhost:5173
  admin:
    seed-email: admin@arcandform.com
    seed-password: Admin@123!
  rate-limit:
    capacity: 1000
    refill-tokens: 1000
    refill-duration-seconds: 60

stripe:
  secret-key: sk_test_mock_test_key
  webhook-secret: whsec_mock_test_secret
  success-url: http://localhost:5173/checkout/success?session_id={CHECKOUT_SESSION_ID}
  cancel-url: http://localhost:5173/checkout?cancelled=true

cloudinary:
  cloud-name: mock_cloud
  api-key: mock_key
  api-secret: mock_secret
